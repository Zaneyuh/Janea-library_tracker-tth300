<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Add New Book</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

```
<nav class="navbar">
    <div class="logo">Library Tracker</div>

    <div class="nav-links">
        <a href="index.html">Dashboard</a>
        <a href="library.html">View Books</a>
        <a href="book-form.html" class="btn-primary">+ Add Book</a>
    </div>
</nav>

<main class="container">

    <div class="form-card">

        <h1 id="form-heading">Add New Book</h1>

        <form id="book-form">

            <div class="form-group">
                <label for="title">Book Title</label>
                <input
                    type="text"
                    id="title"
                    required
                    placeholder="e.g. Dune"
                >
            </div>

            <div class="form-group">
                <label for="author">Author Name</label>
                <input
                    type="text"
                    id="author"
                    required
                    placeholder="e.g. Frank Herbert"
                >
            </div>

            <div class="form-group">
                <label for="genre">Genre</label>
                <input
                    type="text"
                    id="genre"
                    required
                    placeholder="e.g. Fantasy"
                >
            </div>

            <div class="form-actions">

                <a href="library.html" class="btn-cancel">
                    Cancel
                </a>

                <button
                    type="submit"
                    id="submit-btn"
                    class="btn-submit"
                >
                    Save Book
                </button>

            </div>

        </form>

    </div>

</main>

<script src="js/api.js"></script>

<script>

    const form = document.getElementById('book-form');

    // Check if we are editing a book
    const urlParams = new URLSearchParams(window.location.search);
    const bookId = urlParams.get('id');

    // If there is an ID, load the book
    if (bookId) {

        document.getElementById('page-title').innerText = 'Edit Book';
        document.getElementById('form-heading').innerText = 'Edit Book';
        document.getElementById('submit-btn').innerText = 'Update Book';

        loadBook();

    }

    async function loadBook() {

        const book = await api.getBookById(bookId);

        if (!book || book.success === false) {
            alert('Book not found.');
            window.location.href = 'library.html';
            return;
        }

        document.getElementById('title').value = book.title;
        document.getElementById('author').value = book.author;
        document.getElementById('genre').value = book.genre;

    }

    form.addEventListener('submit', async (e) => {

        e.preventDefault();

        const bookData = {
            title: document.getElementById('title').value,
            author: document.getElementById('author').value,
            genre: document.getElementById('genre').value
        };

        let result;

        // Edit existing book
        if (bookId) {

            result = await api.updateBook(bookId, bookData);

            if (result.success) {
                alert('Book updated successfully!');
                window.location.href = 'library.html';
            } else {
                alert('Error: ' + result.message);
            }

        }

        // Add new book
        else {

            result = await api.createBook(bookData);

            if (result.success) {
                alert('Book added successfully!');
                window.location.href = 'library.html';
            } else {
                alert('Error: ' + result.message);
            }

        }

    });

</script>
```

</body>
</html>
